template:
  name: SLSA Provenance Generation Step
  identifier: slsa_generation_step
  type: Step
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  description: >-
    Reusable SLSA provenance generation step for Harness SCS. Generates a
    signed SLSA provenance attestation for a container image using Cosign.
    Captures: repository, branch, commit SHA, builder ID, trigger, timestamp.
    SLSA Level 3 requires Harness Cloud hosted builds (ephemeral VMs).
  tags:
    scs-demo: ""
    slsa: ""
  versionLabel: v1
  spec:
    type: provenance
    timeout: 10m
    spec:
      source:
        type: har
        spec:
          registry: <+input>
          # Harness Artifact Registry ref (e.g., scs-demo)
          image: <+input>
          # Image name (e.g., backend-app:<+pipeline.sequenceId>)
      attestation:
        type: cosign
        spec:
          private_key: <+input>
          # Harness file secret ref for Cosign private key (e.g., demo_cosign_private)
          password: <+input>
          # Harness text secret ref for Cosign key passphrase (e.g., demo_cosign_password)
