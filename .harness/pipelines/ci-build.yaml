pipeline:
  name: SCS Demo CI Build
  identifier: scs_demo_ci_build
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  description: >-
    CI pipeline for SupplyWatch application — builds all three services with
    SBOM generation, SLSA provenance, and OPA policy enforcement.
    Demonstrates Harness Supply Chain Security capabilities.
  tags:
    scs-demo: ""
    supply-chain-security: ""

  properties:
    ci:
      codebase:
        connectorRef: demo_github
        repoName: harnessdemo-supply-chain-security
        build: <+input>

  stages:
    ## ──────────────────────────────────────────────
    ## Stage 1: Build Backend (Node.js / Express)
    ## ──────────────────────────────────────────────
    - stage:
        name: Build Backend
        identifier: build_backend
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesHosted
            spec:
              identifier: Harness_Cloud
          execution:
            steps:
              ## Step 1 — Run Tests
              - step:
                  type: Run
                  name: Run Backend Tests
                  identifier: run_backend_tests
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20-alpine
                    shell: Sh
                    command: |
                      cd app/backend
                      npm ci
                      npm test

              ## Step 2 — Build & Push Docker Image
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Backend Image
                  identifier: build_push_backend
                  spec:
                    connectorRef: demo_dockerhub
                    repo: <+input>
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    context: app/backend
                    dockerfile: app/backend/Dockerfile
                    labels:
                      org.opencontainers.image.source: <+codebase.repoUrl>
                      org.opencontainers.image.revision: <+codebase.commitSha>

              ## Step 3 — SBOM Orchestration (CycloneDX format)
              - step:
                  type: SscaOrchestration
                  name: SBOM Generation - Backend
                  identifier: sbom_backend
                  spec:
                    tool:
                      type: Syft
                      spec:
                        format: cyclonedx-json
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.backend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        privateKey: demo_cosign_private
                        password: demo_cosign_password
                    mode: generation

              ## Step 4 — SLSA Provenance Generation
              - step:
                  type: SlsaVerification
                  name: SLSA Provenance - Backend
                  identifier: slsa_backend
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.backend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public

              ## Step 5 — SBOM Policy Enforcement (OPA)
              - step:
                  type: SscaEnforcement
                  name: SBOM Policy Enforcement - Backend
                  identifier: sbom_policy_backend
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.backend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    verifyAttestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public
                    policy:
                      store:
                        type: OPA
                        spec:
                          policySets:
                            - deny_vulnerable_versions
                            - deny_blocked_components
                    violation:
                      action: Error and Fail Pipeline

    ## ──────────────────────────────────────────────
    ## Stage 2: Build Frontend (React / Vite)
    ## ──────────────────────────────────────────────
    - stage:
        name: Build Frontend
        identifier: build_frontend
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesHosted
            spec:
              identifier: Harness_Cloud
          execution:
            steps:
              ## Step 1 — Run Tests
              - step:
                  type: Run
                  name: Run Frontend Tests
                  identifier: run_frontend_tests
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20-alpine
                    shell: Sh
                    command: |
                      cd app/frontend
                      npm ci
                      npm test

              ## Step 2 — Build & Push Docker Image
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Frontend Image
                  identifier: build_push_frontend
                  spec:
                    connectorRef: demo_dockerhub
                    repo: <+input>
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    context: app/frontend
                    dockerfile: app/frontend/Dockerfile
                    labels:
                      org.opencontainers.image.source: <+codebase.repoUrl>
                      org.opencontainers.image.revision: <+codebase.commitSha>

              ## Step 3 — SBOM Orchestration (SPDX format — demonstrates both formats)
              - step:
                  type: SscaOrchestration
                  name: SBOM Generation - Frontend
                  identifier: sbom_frontend
                  spec:
                    tool:
                      type: Syft
                      spec:
                        format: spdx-json
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.frontend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        privateKey: demo_cosign_private
                        password: demo_cosign_password
                    mode: generation

              ## Step 4 — SLSA Provenance Generation
              - step:
                  type: SlsaVerification
                  name: SLSA Provenance - Frontend
                  identifier: slsa_frontend
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.frontend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public

              ## Step 5 — SBOM Policy Enforcement (OPA)
              - step:
                  type: SscaEnforcement
                  name: SBOM Policy Enforcement - Frontend
                  identifier: sbom_policy_frontend
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.frontend_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    verifyAttestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public
                    policy:
                      store:
                        type: OPA
                        spec:
                          policySets:
                            - deny_gpl_licenses
                            - deny_vulnerable_versions
                            - deny_blocked_components
                    violation:
                      action: Error and Fail Pipeline

    ## ──────────────────────────────────────────────
    ## Stage 3: Build Notification Service (Java / Spring Boot)
    ## ──────────────────────────────────────────────
    - stage:
        name: Build Notification Service
        identifier: build_notification
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesHosted
            spec:
              identifier: Harness_Cloud
          execution:
            steps:
              ## Step 1 — Run Tests
              - step:
                  type: Run
                  name: Run Notification Tests
                  identifier: run_notification_tests
                  spec:
                    connectorRef: account.harnessImage
                    image: maven:3.9-eclipse-temurin-21
                    shell: Sh
                    command: |
                      cd app/notification-service
                      mvn test -B

              ## Step 2 — Build & Push Docker Image
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Notification Image
                  identifier: build_push_notification
                  spec:
                    connectorRef: demo_dockerhub
                    repo: <+input>
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    context: app/notification-service
                    dockerfile: app/notification-service/Dockerfile
                    labels:
                      org.opencontainers.image.source: <+codebase.repoUrl>
                      org.opencontainers.image.revision: <+codebase.commitSha>

              ## Step 3 — SBOM Orchestration (CycloneDX — demonstrates Maven SBOM)
              - step:
                  type: SscaOrchestration
                  name: SBOM Generation - Notification
                  identifier: sbom_notification
                  spec:
                    tool:
                      type: Syft
                      spec:
                        format: cyclonedx-json
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.notification_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        privateKey: demo_cosign_private
                        password: demo_cosign_password
                    mode: generation

              ## Step 4 — SLSA Provenance Generation
              - step:
                  type: SlsaVerification
                  name: SLSA Provenance - Notification
                  identifier: slsa_notification
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.notification_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    attestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public

              ## Step 5 — SBOM Policy Enforcement (OPA)
              - step:
                  type: SscaEnforcement
                  name: SBOM Policy Enforcement - Notification
                  identifier: sbom_policy_notification
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+artifacts.notification_image.imagePath>
                        tag: <+pipeline.sequenceId>
                    verifyAttestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public
                    policy:
                      store:
                        type: OPA
                        spec:
                          policySets:
                            - deny_vulnerable_versions
                            - deny_blocked_components
                    violation:
                      action: Error and Fail Pipeline

  ## ──────────────────────────────────────────────
  ## Triggers
  ## ──────────────────────────────────────────────
  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []

    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize

  ## ──────────────────────────────────────────────
  ## Notifications
  ## ──────────────────────────────────────────────
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
