pipeline:
  name: SCS Demo CD Deploy
  identifier: scs_demo_cd_deploy
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  description: >-
    CD pipeline for SupplyWatch application — deploys to Dev, Staging, and Prod
    with deploy-time SBOM generation, OPA policy enforcement, and SLSA
    verification gates. Demonstrates Harness SCS governance at deployment.
  tags:
    scs-demo: ""
    supply-chain-security: ""

  ## ──────────────────────────────────────────────
  ## Pipeline-level input: artifact details from CI
  ## ──────────────────────────────────────────────
  inputSetTemplateBody: |
    pipeline:
      variables:
        - name: backend_image
          type: String
          value: <+input>
        - name: frontend_image
          type: String
          value: <+input>
        - name: notification_image
          type: String
          value: <+input>
        - name: image_tag
          type: String
          value: <+input>

  variables:
    - name: backend_image
      type: String
      description: Backend Docker image path (e.g., dockerhub-user/supplywatch-backend)
      required: true
      value: <+input>
    - name: frontend_image
      type: String
      description: Frontend Docker image path
      required: true
      value: <+input>
    - name: notification_image
      type: String
      description: Notification service Docker image path
      required: true
      value: <+input>
    - name: image_tag
      type: String
      description: Image tag to deploy
      required: true
      value: <+input>

  stages:
    ## ──────────────────────────────────────────────
    ## Stage 1: Deploy to Dev
    ## ──────────────────────────────────────────────
    - stage:
        name: Deploy to Dev
        identifier: deploy_dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          environment:
            environmentRef: dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: dev_k8s
          serviceConfig:
            serviceRef: supplywatch
            serviceDefinition:
              type: Kubernetes
              spec:
                manifests:
                  - manifest:
                      identifier: k8s_manifests
                      type: K8sManifest
                      spec:
                        store:
                          type: Github
                          spec:
                            connectorRef: demo_github
                            repoName: harnessdemo-supply-chain-security
                            branch: main
                            paths:
                              - k8s/
                artifacts:
                  primary:
                    primaryArtifactRef: backend_artifact
                    sources:
                      - identifier: backend_artifact
                        type: DockerRegistry
                        spec:
                          connectorRef: demo_dockerhub
                          imagePath: <+pipeline.variables.backend_image>
                          tag: <+pipeline.variables.image_tag>
          execution:
            steps:
              ## Containerized Step Group — required for SBOM Orchestration in Deploy stages
              - stepGroup:
                  name: SCS Verification Gates
                  identifier: scs_gates_dev
                  steps:
                    ## Step 1 — Deploy-time SBOM Orchestration
                    - step:
                        type: SscaOrchestration
                        name: SBOM Orchestration - Dev
                        identifier: sbom_dev
                        spec:
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          mode: generation

                    ## Step 2 — SBOM Policy Enforcement (dev — lenient policy set)
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement - Dev
                        identifier: sbom_policy_dev
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: OPA
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                          violation:
                            action: Error and Fail Pipeline

                    ## Step 3 — SLSA Verification
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification - Dev
                        identifier: slsa_verify_dev
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          attestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-dev

              ## Step 4 — Kubernetes Deployment (Rolling Update)
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Dev
                  identifier: k8s_deploy_dev
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m

            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Dev
                  identifier: rollback_dev
                  spec: {}

    ## ──────────────────────────────────────────────
    ## Stage 2: Deploy to Staging (Approval Gate)
    ## ──────────────────────────────────────────────
    - stage:
        name: Deploy to Staging
        identifier: deploy_staging
        type: Deployment
        spec:
          deploymentType: Kubernetes
          environment:
            environmentRef: staging
            deployToAll: false
            infrastructureDefinitions:
              - identifier: staging_k8s
          serviceConfig:
            serviceRef: supplywatch
            serviceDefinition:
              type: Kubernetes
              spec:
                manifests:
                  - manifest:
                      identifier: k8s_manifests
                      type: K8sManifest
                      spec:
                        store:
                          type: Github
                          spec:
                            connectorRef: demo_github
                            repoName: harnessdemo-supply-chain-security
                            branch: main
                            paths:
                              - k8s/
                artifacts:
                  primary:
                    primaryArtifactRef: backend_artifact
                    sources:
                      - identifier: backend_artifact
                        type: DockerRegistry
                        spec:
                          connectorRef: demo_dockerhub
                          imagePath: <+pipeline.variables.backend_image>
                          tag: <+pipeline.variables.image_tag>
          execution:
            steps:
              ## Step 1 — Manual Approval
              - step:
                  type: HarnessApproval
                  name: Approve Staging Deployment
                  identifier: approve_staging
                  spec:
                    approvalMessage: >-
                      Please review the Dev deployment and SCS verification
                      results before approving promotion to Staging.
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    includePipelineExecutionHistory: true
                  timeout: 1d

              ## Containerized Step Group — SCS gates for Staging
              - stepGroup:
                  name: SCS Verification Gates
                  identifier: scs_gates_staging
                  steps:
                    ## Step 2 — SBOM Policy Enforcement (staging — stricter policy set)
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement - Staging
                        identifier: sbom_policy_staging
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: OPA
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                                  - deny_blocked_components
                                  - deny_gpl_licenses
                          violation:
                            action: Error and Fail Pipeline

                    ## Step 3 — SLSA Verification
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification - Staging
                        identifier: slsa_verify_staging
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          attestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-staging

              ## Step 4 — Kubernetes Deployment
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Staging
                  identifier: k8s_deploy_staging
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m

            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Staging
                  identifier: rollback_staging
                  spec: {}

    ## ──────────────────────────────────────────────
    ## Stage 3: Deploy to Prod (Promotion Gate)
    ## ──────────────────────────────────────────────
    - stage:
        name: Deploy to Production
        identifier: deploy_prod
        type: Deployment
        spec:
          deploymentType: Kubernetes
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: prod_k8s
          serviceConfig:
            serviceRef: supplywatch
            serviceDefinition:
              type: Kubernetes
              spec:
                manifests:
                  - manifest:
                      identifier: k8s_manifests
                      type: K8sManifest
                      spec:
                        store:
                          type: Github
                          spec:
                            connectorRef: demo_github
                            repoName: harnessdemo-supply-chain-security
                            branch: main
                            paths:
                              - k8s/
                artifacts:
                  primary:
                    primaryArtifactRef: backend_artifact
                    sources:
                      - identifier: backend_artifact
                        type: DockerRegistry
                        spec:
                          connectorRef: demo_dockerhub
                          imagePath: <+pipeline.variables.backend_image>
                          tag: <+pipeline.variables.image_tag>
          execution:
            steps:
              ## Step 1 — Artifact Promotion Policy Check (SLSA + SBOM required)
              - step:
                  type: SscaEnforcement
                  name: Artifact Promotion Policy Check
                  identifier: promotion_policy_check
                  spec:
                    source:
                      type: image
                      spec:
                        connector: demo_dockerhub
                        image: <+pipeline.variables.backend_image>
                        tag: <+pipeline.variables.image_tag>
                    verifyAttestation:
                      type: cosign
                      spec:
                        publicKey: demo_cosign_public
                    policy:
                      store:
                        type: OPA
                        spec:
                          policySets:
                            - require_slsa_attestation
                    violation:
                      action: Error and Fail Pipeline

              ## Step 2 — Manual Approval
              - step:
                  type: HarnessApproval
                  name: Approve Production Deployment
                  identifier: approve_prod
                  spec:
                    approvalMessage: >-
                      Production deployment requires approval. Verify that SLSA
                      attestation is present, SBOM policies pass, and Staging
                      deployment is healthy.
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: true
                    includePipelineExecutionHistory: true
                  timeout: 1d

              ## Containerized Step Group — strictest SCS gates for Prod
              - stepGroup:
                  name: SCS Verification Gates
                  identifier: scs_gates_prod
                  steps:
                    ## Step 3 — SBOM Policy Enforcement (prod — strictest policy set)
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement - Prod
                        identifier: sbom_policy_prod
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: OPA
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                                  - deny_blocked_components
                                  - deny_gpl_licenses
                                  - sbom_drift_approval
                          violation:
                            action: Error and Fail Pipeline

                    ## Step 4 — SLSA Verification
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification - Prod
                        identifier: slsa_verify_prod
                        spec:
                          source:
                            type: image
                            spec:
                              connector: demo_dockerhub
                              image: <+pipeline.variables.backend_image>
                              tag: <+pipeline.variables.image_tag>
                          attestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-prod

              ## Step 5 — Kubernetes Deployment
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Production
                  identifier: k8s_deploy_prod
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m

            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Production
                  identifier: rollback_prod
                  spec: {}

  ## ──────────────────────────────────────────────
  ## Notifications
  ## ──────────────────────────────────────────────
  notificationRules:
    - name: Deploy Gate Failure
      identifier: deploy_gate_failure
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true

    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - deploy_staging
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
