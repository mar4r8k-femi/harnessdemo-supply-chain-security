pipeline:
  name: SCS Demo CI-CD Pipeline
  identifier: scs_demo_ci_build
  projectIdentifier: Femi_Sandbox
  orgIdentifier: sandbox
  description: Full CI/CD pipeline for SupplyWatch — builds all three services with SBOM generation, SLSA provenance, and OPA policy enforcement, then deploys through Dev, Staging, and Production with progressive SCS governance gates.
  tags:
    scs-demo: ""
    supply-chain-security: ""
  properties:
    ci:
      codebase:
        connectorRef: femigithub
        repoName: harnessdemo-supply-chain-security
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Secure All Services
        identifier: build_and_secure
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Run Tests
                  identifier: run_tests
                  steps:
                    - step:
                        type: Run
                        name: Run Backend Tests
                        identifier: run_backend_tests
                        spec:
                          connectorRef: account.harnessImage
                          image: node:20-alpine
                          shell: Sh
                          command: |
                            cd app/backend
                            npm ci
                            npm test
                    - step:
                        type: Run
                        name: Run Frontend Tests
                        identifier: run_frontend_tests
                        spec:
                          connectorRef: account.harnessImage
                          image: node:20-alpine
                          shell: Sh
                          command: |
                            cd app/frontend
                            rm -rf node_modules package-lock.json
                            npm install
                            npm test
                      contextType: Pipeline
                    - step:
                        type: Run
                        name: Run Notification Tests
                        identifier: run_notification_tests
                        spec:
                          connectorRef: account.harnessImage
                          image: maven:3.9-eclipse-temurin-21
                          shell: Sh
                          command: |
                            cd app/notification-service
                            mvn test -B
                      contextType: Pipeline
              - stepGroup:
                  name: Build and Push Images
                  identifier: build_push_images
                  steps:
                    - parallel:
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Backend
                            identifier: build_push_backend
                            spec:
                              repo: backend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/backend/Dockerfile
                              context: app/backend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Frontend
                            identifier: build_push_frontend
                            spec:
                              repo: frontend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/frontend/Dockerfile
                              context: app/frontend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Notification
                            identifier: build_push_notification
                            spec:
                              repo: notification-service-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/notification-service/Dockerfile
                              context: app/notification-service
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
              - parallel:
                  - stepGroup:
                      name: SCS Backend
                      identifier: scs_backend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation - Backend
                            identifier: sbom_generation_backend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance - Backend
                            identifier: slsa_provenance_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                  - stepGroup:
                      name: SCS Frontend
                      identifier: scs_frontend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation - Frontend
                            identifier: sbom_generation_frontend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: spdx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance - Frontend
                            identifier: slsa_provenance_frontend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                  - stepGroup:
                      name: SCS Notification
                      identifier: scs_notification
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation - Notification
                            identifier: sbom_generation_notification
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance - Notification
                            identifier: slsa_provenance_notification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
          caching:
            enabled: true
            paths: []
          buildIntelligence:
            enabled: true
        description: ""
    - stage:
        name: Deploy to Dev
        identifier: deploy_dev
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
            serviceInputs: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - parallel:
                  - stepGroup:
                      name: SCS Gates Dev - Backend
                      identifier: scs_gates_dev_backend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Backend
                            identifier: sbom_orchestration_backend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Backend
                            identifier: sbom_policy_enforcement_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Backend
                            identifier: slsa_verification_backend
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: backend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Backend
                            identifier: artifact_verification_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-dev
                  - stepGroup:
                      name: SCS Gates Dev - Frontend
                      identifier: scs_gates_dev_frontend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Frontend
                            identifier: sbom_orchestration_frontend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: spdx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Frontend
                            identifier: sbom_policy_enforcement_frontend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Frontend
                            identifier: slsa_verification_frontend
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: frontend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Frontend
                            identifier: artifact_verification_frontend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-dev
                  - stepGroup:
                      name: SCS Gates Dev - Notification
                      identifier: scs_gates_dev_notification
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Notification
                            identifier: sbom_orchestration_notification
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Notification
                            identifier: sbom_policy_enforcement_notification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Notification
                            identifier: slsa_verification_notification
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: notification-service-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Notification
                            identifier: artifact_verification_notification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-dev
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Dev
                  identifier: k8s_deploy_dev
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Dev
                  identifier: rollback_dev
                  spec: {}
    - stage:
        name: Deploy to Staging
        identifier: deploy_staging
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Staging Deployment
                  identifier: approve_staging
                  spec:
                    approvalMessage: Please review the Dev deployment and SCS verification results before approving promotion to Staging.
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    includePipelineExecutionHistory: true
                  timeout: 1d
              - parallel:
                  - stepGroup:
                      name: SCS Gates Staging - Backend
                      identifier: scs_gates_staging_backend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Backend
                            identifier: sbom_orchestration_backend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Backend
                            identifier: sbom_policy_enforcement_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                                      - deny_blocked_components
                                      - deny_gpl_licenses
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Backend
                            identifier: slsa_verification_backend
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: backend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Backend
                            identifier: artifact_verification_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-staging
                  - stepGroup:
                      name: SCS Gates Staging - Frontend
                      identifier: scs_gates_staging_frontend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Frontend
                            identifier: sbom_orchestration_frontend
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: spdx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Frontend
                            identifier: sbom_policy_enforcement_frontend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                                      - deny_blocked_components
                                      - deny_gpl_licenses
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Frontend
                            identifier: slsa_verification_frontend
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: frontend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Frontend
                            identifier: artifact_verification_frontend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-staging
                  - stepGroup:
                      name: SCS Gates Staging - Notification
                      identifier: scs_gates_staging_notification
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Orchestration - Notification
                            identifier: sbom_orchestration_notification
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement - Notification
                            identifier: sbom_policy_enforcement_notification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - deny_vulnerable_versions
                                      - deny_blocked_components
                                      - deny_gpl_licenses
                              violation:
                                action: Error and Fail Pipeline
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification - Notification
                            identifier: slsa_verification_notification
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: notification-service-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification - Notification
                            identifier: artifact_verification_notification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                      stepGroupInfra:
                        type: KubernetesDirect
                        spec:
                          connectorRef: <+input>
                          namespace: supplywatch-staging
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Staging
                  identifier: k8s_deploy_staging
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Staging
                  identifier: rollback_staging
                  spec: {}
    - stage:
        name: Deploy to Production
        identifier: deploy_prod
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              - parallel:
                  - stepGroup:
                      name: Promotion Policy - Backend
                      identifier: promotion_policy_backend
                      steps:
                        - step:
                            type: SscaEnforcement
                            name: SLSA Attestation Check - Backend
                            identifier: slsa_attestation_check_backend
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                store:
                                  type: Harness
                                  spec:
                                    policySets:
                                      - require_slsa_attestation
                              violation:
                                action: Error and Fail Pipeline
                  - stepGroup:
                      name: Promotion Policy - Frontend
                      identifier: promotion_policy_frontend
                      steps:
                        - step:
                            type: SscaEnforcement
                            name: SLSA Attestation Check - Frontend
