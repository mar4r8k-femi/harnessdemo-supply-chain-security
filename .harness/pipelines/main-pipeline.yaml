pipeline:
  name: SCS Demo CI-CD Pipeline
  identifier: scs_demo_ci_build
  projectIdentifier: Femi_Sandbox
  orgIdentifier: sandbox
  description: CI/CD pipeline for SupplyWatch — builds all three services with SBOM generation, SLSA provenance, and OPA policy enforcement, then deploys to Production with full SCS governance gates.
  tags:
    scs-demo: ""
    supply-chain-security: ""
  properties:
    ci:
      codebase:
        connectorRef: femigithub
        repoName: harnessdemo-supply-chain-security
        build: <+input>
        sparseCheckout: []
  variables:
    - name: scenario_preset
      type: String
      description: Demo control. no-scs-gates = vanilla CI/CD, no SCS steps; with-scs-gates = full SCS suite blocks the vulnerable build; remediated = SCS suite + clean deps for the green-path close.
      required: true
      value: <+input>.allowedValues(no-scs-gates,with-scs-gates,remediated).default(with-scs-gates)
  stages:
    - stage:
        name: Build and Secure All Services
        identifier: build_and_secure
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Pre-Build Mutations
                  identifier: pre_build_mutations
                  steps:
                    - step:
                        type: Run
                        name: Swap to Clean Deps
                        identifier: swap_clean_deps
                        when:
                          stageStatus: Success
                          condition: <+pipeline.variables.scenario_preset> == "remediated"
                        spec:
                          connectorRef: account.harnessImage
                          image: node:20
                          shell: Sh
                          command: |
                            bash demo/scripts/swap-vulnerable-dep.sh clean
              - stepGroup:
                  name: Run Tests
                  identifier: run_tests
                  steps:
                    - parallel:
                        - step:
                            type: Run
                            name: Run Backend Tests
                            identifier: run_backend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: node:20-alpine
                              shell: Sh
                              command: |
                                cd app/backend
                                npm ci
                                npm test
                        - step:
                            type: Run
                            name: Run Frontend Tests
                            identifier: run_frontend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: node:20-alpine
                              shell: Sh
                              command: |
                                cd app/frontend
                                rm -rf node_modules package-lock.json
                                npm install
                                npm test
                        - step:
                            type: Run
                            name: Run Notification Tests
                            identifier: run_notification_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: maven:3.9-eclipse-temurin-21
                              shell: Sh
                              command: |
                                cd app/notification-service
                                mvn test -B
              - stepGroup:
                  name: Build and Push Images
                  identifier: build_push_images
                  steps:
                    - parallel:
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Backend
                            identifier: build_push_backend
                            spec:
                              repo: backend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/backend/Dockerfile
                              context: app/backend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Frontend
                            identifier: build_push_frontend
                            spec:
                              repo: frontend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/frontend/Dockerfile
                              context: app/frontend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Notification
                            identifier: build_push_notification
                            spec:
                              repo: notification-service-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/notification-service/Dockerfile
                              context: app/notification-service
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
              - step:
                  type: Run
                  name: Package Frontend Dist
                  identifier: package_frontend_dist
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20-alpine
                    shell: Sh
                    command: |
                      set -e
                      apk add --no-cache curl tar gzip
                      cd app/frontend
                      rm -rf node_modules package-lock.json
                      npm install
                      npm run build
                      cd ..
                      TARBALL="frontend-dist-<+pipeline.sequenceId>.tar.gz"
                      tar -czf "/harness/${TARBALL}" -C frontend/dist .
                      cd /harness
                      ls -lh "${TARBALL}"
                      curl --fail --show-error --location \
                        --header "x-api-key: <+secrets.getValue('harness_api_token')>" \
                        --upload-file "${TARBALL}" \
                        "https://app.harness.io/gateway/har-api/v1/orgs/<+pipeline.orgIdentifier>/projects/<+pipeline.projectIdentifier>/repositories/scs-demo/artifacts/${TARBALL}"
                      echo ""
                      echo "=================================================="
                      echo " Frontend dist uploaded: ${TARBALL}"
                      echo " Repo: scs-demo"
                      echo "=================================================="
              - stepGroup:
                  name: SCS Service
                  identifier: scs_service
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.scenario_preset> != "no-scs-gates"
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Generation
                        identifier: sbom_generation
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: provenance
                        name: SLSA Provenance
                        identifier: slsa_provenance
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              private_key: demo_cosign_private
                              password: demo_cosign_password
                    - step:
                        type: SscaArtifactSigning
                        name: Artifact Signing
                        identifier: artifact_signing
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image>:<+pipeline.sequenceId>
                          signing:
                            type: cosign
                            spec:
                              private_key: demo_cosign_private
                              password: demo_cosign_password
                          uploadSignature:
                            upload: true
                  strategy:
                    matrix:
                      image:
                        - backend-app
                        - frontend-app
                        - notification-service-app
                      maxConcurrency: 3
                      nodeName: SCS <+matrix.image>
          caching:
            enabled: true
            paths: []
          buildIntelligence:
            enabled: true
        description: ""
    - stage:
        name: Approval
        identifier: Approval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approval
                  identifier: Approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
    - stage:
        name: Deploy SupplyWatch
        identifier: Deploy_SupplyWatch
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          services:
            values:
              - serviceRef: supplywatch
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchfrontend
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchnotification
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
            metadata:
              parallel: true
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: supplywatchprod
          execution:
            steps:
              - stepGroup:
                  name: SCS Gates Prod
                  identifier: scs_gates_prod
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.scenario_preset> != "no-scs-gates"
                  steps:
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification
                        identifier: slsa_verification
                        spec:
                          source:
                            type: Har
                            spec:
                              registry: scs-demo
                              tag: <+pipeline.sequenceId>
                              image: <+serviceVariables.image_name>
                          verify_attestation:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
                    - step:
                        type: SscaArtifactVerification
                        name: Artifact Verification
                        identifier: artifact_verification
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+serviceVariables.image_name>:<+pipeline.sequenceId>
                          verifySign:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement
                        identifier: sbom_policy_enforcement
                        spec:
                          source:
                            type: har
                            spec:
                              image: <+serviceVariables.image_name>:<+pipeline.sequenceId>
                              registry: scs-demo
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            policySets:
                              - SBOM_CI_Enforcement
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: FemiK8sGCP
              - stepGroup:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  steps:
                    - step:
                        name: Canary Deployment
                        identifier: canaryDeployment
                        type: K8sCanaryDeploy
                        timeout: 10m
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                    - step:
                        name: Canary Delete
                        identifier: canaryDelete
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}
              - stepGroup:
                  name: Primary Deployment
                  identifier: primaryDeployment
                  steps:
                    - step:
                        name: Rolling Deployment
                        identifier: rollingDeployment
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []
    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - build_and_secure
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
  allowStageExecutions: true
