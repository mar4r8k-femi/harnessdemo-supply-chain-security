  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []
    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - deploy_staging
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
  allowStageExecutions: true
