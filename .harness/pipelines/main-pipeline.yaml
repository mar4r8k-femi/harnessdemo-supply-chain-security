pipeline:
  name: SCS Demo CI-CD Pipeline
  identifier: scs_demo_ci_build
  projectIdentifier: Femi_Sandbox
  orgIdentifier: sandbox
  description: Full CI/CD pipeline for SupplyWatch — builds all three services with SBOM generation, SLSA provenance, and OPA policy enforcement, then deploys through Dev, Staging, and Production with progressive SCS governance gates.
  tags:
    scs-demo: ""
    supply-chain-security: ""
  variables:
    - name: run_backend
      type: String
      description: Include backend service in this pipeline run
      required: false
      default: "true"
      value: <+input>.allowedValues(true,false)
    - name: run_frontend
      type: String
      description: Include frontend service in this pipeline run
      required: false
      default: "true"
      value: <+input>.allowedValues(true,false)
    - name: run_notification
      type: String
      description: Include notification service in this pipeline run
      required: false
      default: "true"
      value: <+input>.allowedValues(true,false)
  properties:
    ci:
      codebase:
        connectorRef: femigithub
        repoName: harnessdemo-supply-chain-security
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Secure All Services
        identifier: build_and_secure
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # ── Run Tests (matrix per service) ─────────────────────
              - stepGroup:
                  name: Run Tests
                  identifier: run_tests
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          test_image: node:20-alpine
                          test_command: "cd app/backend && npm ci && npm test"
                        - service_name: frontend
                          test_image: node:20-alpine
                          test_command: "cd app/frontend && rm -rf node_modules package-lock.json && npm install && npm test"
                        - service_name: notification
                          test_image: maven:3.9-eclipse-temurin-21
                          test_command: "cd app/notification-service && mvn test -B"
                      maxConcurrency: 3
                  steps:
                    - step:
                        type: Run
                        name: Run Tests
                        identifier: run_tests
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          connectorRef: account.harnessImage
                          image: <+matrix.test_image>
                          shell: Sh
                          command: <+matrix.test_command>
              # ── Build and Push Images (matrix per service) ─────────
              - stepGroup:
                  name: Build and Push Images
                  identifier: build_push_images
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                          dockerfile: app/backend/Dockerfile
                          context: app/backend
                        - service_name: frontend
                          image_repo: frontend-app
                          dockerfile: app/frontend/Dockerfile
                          context: app/frontend
                        - service_name: notification
                          image_repo: notification-service-app
                          dockerfile: app/notification-service/Dockerfile
                          context: app/notification-service
                      maxConcurrency: 3
                  steps:
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: Build and Push
                        identifier: build_push
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          repo: <+matrix.image_repo>
                          tags:
                            - <+pipeline.sequenceId>
                          caching: true
                          dockerfile: <+matrix.dockerfile>
                          context: <+matrix.context>
                          labels:
                            org.opencontainers.image.source: <+codebase.repoUrl>
                            org.opencontainers.image.revision: <+codebase.commitSha>
                          registryRef: scs-demo
              # ── Supply Chain Security (SBOM + SLSA Provenance) ─────
              - stepGroup:
                  name: Supply Chain Security
                  identifier: scs_services
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                        - service_name: frontend
                          image_repo: frontend-app
                        - service_name: notification
                          image_repo: notification-service-app
                      maxConcurrency: 3
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Generation
                        identifier: sbom_generation
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: provenance
                        name: SLSA Provenance
                        identifier: slsa_provenance
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              private_key: demo_cosign_private
                              password: demo_cosign_password
          caching:
            enabled: true
            paths: []
          buildIntelligence:
            enabled: true
        description: ""
    - stage:
        name: Deploy to Dev
        identifier: deploy_dev
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
            serviceInputs: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - stepGroup:
                  name: SCS Gates Dev
                  identifier: scs_gates_dev
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                        - service_name: frontend
                          image_repo: frontend-app
                        - service_name: notification
                          image_repo: notification-service-app
                      maxConcurrency: 3
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-dev
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Orchestration
                        identifier: sbom_orchestration
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement
                        identifier: sbom_policy_enforcement
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: Harness
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                          violation:
                            action: Error and Fail Pipeline
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification
                        identifier: slsa_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: Har
                            spec:
                              registry: scs-demo
                              tag: <+pipeline.sequenceId>
                              image: <+matrix.image_repo>
                          verify_attestation:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
                    - step:
                        type: SscaArtifactVerification
                        name: Artifact Verification
                        identifier: artifact_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifySign:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Dev
                  identifier: k8s_deploy_dev
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Dev
                  identifier: rollback_dev
                  spec: {}
    - stage:
        name: Deploy to Staging
        identifier: deploy_staging
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Staging Deployment
                  identifier: approve_staging
                  spec:
                    approvalMessage: Please review the Dev deployment and SCS verification results before approving promotion to Staging.
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    includePipelineExecutionHistory: true
                  timeout: 1d
              - stepGroup:
                  name: SCS Gates Staging
                  identifier: scs_gates_staging
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                        - service_name: frontend
                          image_repo: frontend-app
                        - service_name: notification
                          image_repo: notification-service-app
                      maxConcurrency: 3
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-staging
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Orchestration
                        identifier: sbom_orchestration
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement
                        identifier: sbom_policy_enforcement
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: Harness
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                                  - deny_blocked_components
                                  - deny_gpl_licenses
                          violation:
                            action: Error and Fail Pipeline
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification
                        identifier: slsa_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: Har
                            spec:
                              registry: scs-demo
                              tag: <+pipeline.sequenceId>
                              image: <+matrix.image_repo>
                          verify_attestation:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
                    - step:
                        type: SscaArtifactVerification
                        name: Artifact Verification
                        identifier: artifact_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifySign:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Staging
                  identifier: k8s_deploy_staging
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Staging
                  identifier: rollback_staging
                  spec: {}
    - stage:
        name: Deploy to Production
        identifier: deploy_prod
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              # ── Promotion Policy (SLSA attestation gate) ───────────
              - stepGroup:
                  name: Promotion Policy
                  identifier: promotion_policy
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                        - service_name: frontend
                          image_repo: frontend-app
                        - service_name: notification
                          image_repo: notification-service-app
                      maxConcurrency: 3
                  steps:
                    - step:
                        type: SscaEnforcement
                        name: SLSA Attestation Check
                        identifier: slsa_attestation_check
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: Harness
                              spec:
                                policySets:
                                  - require_slsa_attestation
                          violation:
                            action: Error and Fail Pipeline
              - step:
                  type: HarnessApproval
                  name: Approve Production Deployment
                  identifier: approve_prod
                  spec:
                    approvalMessage: Production deployment requires approval. Verify that SLSA attestation is present, SBOM policies pass, and Staging deployment is healthy.
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: true
                    includePipelineExecutionHistory: true
                  timeout: 1d
              # ── SCS Gates Prod ─────────────────────────────────────
              - stepGroup:
                  name: SCS Gates Prod
                  identifier: scs_gates_prod
                  strategy:
                    matrix:
                      include:
                        - service_name: backend
                          image_repo: backend-app
                        - service_name: frontend
                          image_repo: frontend-app
                        - service_name: notification
                          image_repo: notification-service-app
                      maxConcurrency: 3
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: <+input>
                      namespace: supplywatch-prod
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Orchestration
                        identifier: sbom_orchestration
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: cyclonedx-json
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          attestation:
                            type: cosign
                            spec:
                              privateKey: demo_cosign_private
                              password: demo_cosign_password
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: SscaEnforcement
                        name: SBOM Policy Enforcement
                        identifier: sbom_policy_enforcement
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifyAttestation:
                            type: cosign
                            spec:
                              publicKey: demo_cosign_public
                          policy:
                            store:
                              type: Harness
                              spec:
                                policySets:
                                  - deny_vulnerable_versions
                                  - deny_blocked_components
                                  - deny_gpl_licenses
                                  - sbom_drift_approval
                          violation:
                            action: Error and Fail Pipeline
                    - step:
                        type: SlsaVerification
                        name: SLSA Verification
                        identifier: slsa_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: Har
                            spec:
                              registry: scs-demo
                              tag: <+pipeline.sequenceId>
                              image: <+matrix.image_repo>
                          verify_attestation:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
                    - step:
                        type: SscaArtifactVerification
                        name: Artifact Verification
                        identifier: artifact_verification
                        when:
                          stageStatus: Success
                          condition: <+matrix.service_name> == "backend" && <+pipeline.variables.run_backend> == "true" || <+matrix.service_name> == "frontend" && <+pipeline.variables.run_frontend> == "true" || <+matrix.service_name> == "notification" && <+pipeline.variables.run_notification> == "true"
                        spec:
                          source:
                            type: har
                            spec:
                              registry: scs-demo
                              image: <+matrix.image_repo>:<+pipeline.sequenceId>
                          verifySign:
                            type: cosign
                            spec:
                              public_key: demo_cosign_public
              - step:
                  type: K8sRollingDeploy
                  name: Deploy to Production
                  identifier: k8s_deploy_prod
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Production
                  identifier: rollback_prod
                  spec: {}
  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []
    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - deploy_staging
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
  allowStageExecutions: true
