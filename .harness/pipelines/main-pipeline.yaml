pipeline:
  name: SCS Demo CI-CD Pipeline
  identifier: scs_demo_ci_build
  projectIdentifier: Femi_Sandbox
  orgIdentifier: sandbox
  description: CI/CD pipeline for SupplyWatch — builds all three services with SBOM generation, SLSA provenance, and OPA policy enforcement, then deploys to Production with full SCS governance gates.
  tags:
    scs-demo: ""
    supply-chain-security: ""
  properties:
    ci:
      codebase:
        connectorRef: femigithub
        repoName: harnessdemo-supply-chain-security
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Secure All Services
        identifier: build_and_secure
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Run Tests
                  identifier: run_tests
                  steps:
                    - parallel:
                        - step:
                            type: Run
                            name: Run Backend Tests
                            identifier: run_backend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/node:20-alpine
                              shell: Sh
                              command: |
                                cd app/backend
                                npm ci
                                npm test
                        - step:
                            type: Run
                            name: Run Frontend Tests
                            identifier: run_frontend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/node:20-alpine
                              shell: Sh
                              command: |
                                cd app/frontend
                                rm -rf node_modules package-lock.json
                                npm install
                                npm test
                        - step:
                            type: Run
                            name: Run Notification Tests
                            identifier: run_notification_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/maven:3.9-eclipse-temurin-21
                              shell: Sh
                              command: |
                                cd app/notification-service
                                mvn test -B
              - stepGroup:
                  name: Build and Push Images
                  identifier: build_push_images
                  steps:
                    - parallel:
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Backend
                            identifier: build_push_backend
                            spec:
                              repo: backend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/backend/Dockerfile
                              context: app/backend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Frontend
                            identifier: build_push_frontend
                            spec:
                              repo: frontend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/frontend/Dockerfile
                              context: app/frontend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Notification
                            identifier: build_push_notification
                            spec:
                              repo: notification-service-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/notification-service/Dockerfile
                              context: app/notification-service
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
          caching:
            enabled: true
            paths: []
          buildIntelligence:
            enabled: true
        description: ""
    - stage:
        name: Approval
        identifier: Approval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approval
                  identifier: Approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
    - stage:
        name: Deploy SupplyWatch
        identifier: Deploy_SupplyWatch
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          services:
            values:
              - serviceRef: supplywatch
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchfrontend
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchnotification
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
            metadata:
              parallel: true
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: supplywatchprod
          execution:
            steps:
              - stepGroup:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  steps:
                    - step:
                        name: Canary Deployment
                        identifier: canaryDeployment
                        type: K8sCanaryDeploy
                        timeout: 10m
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                    - step:
                        name: Canary Delete
                        identifier: canaryDelete
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}
              - stepGroup:
                  name: Primary Deployment
                  identifier: primaryDeployment
                  steps:
                    - step:
                        name: Rolling Deployment
                        identifier: rollingDeployment
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
              - step:
                  name: Get Frontend URL
                  identifier: get_frontend_url
                  type: ShellScript
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+service.identifier> == "supplywatchfrontend"
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          for i in {1..30}; do
                            EXTERNAL_IP=$(kubectl get svc supplywatchfrontend-svc -n prod-env -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                            if [ -n "$EXTERNAL_IP" ]; then
                              FRONTEND_URL="http://${EXTERNAL_IP}"
                              echo "Frontend URL: $FRONTEND_URL"
                              export FRONTEND_URL
                              break
                            fi
                            echo "Waiting for LoadBalancer IP... (attempt $i/30)"
                            sleep 10
                          done
                          if [ -z "$EXTERNAL_IP" ]; then
                            echo "WARNING: LoadBalancer IP not assigned after 5 minutes"
                            exit 1
                          fi
                    outputVariables:
                      - name: FRONTEND_URL
                        type: String
                        value: FRONTEND_URL
                    onDelegate: true
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []
    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - build_and_secure
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
  allowStageExecutions: true
