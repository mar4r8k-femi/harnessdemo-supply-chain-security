pipeline:
  name: SCS Demo CI-CD Pipeline
  identifier: scs_demo_ci_build
  projectIdentifier: Femi_Sandbox
  orgIdentifier: sandbox
  description: CI/CD pipeline for SupplyWatch — builds all three services with SBOM generation, SLSA provenance, and OPA policy enforcement, then deploys to Production with full SCS governance gates.
  tags:
    scs-demo: ""
    supply-chain-security: ""
  properties:
    ci:
      codebase:
        connectorRef: femigithub
        repoName: harnessdemo-supply-chain-security
        build: <+input>
        sparseCheckout: []
  variables:
    - name: scenario_preset
      type: String
      description: One-click demo preset. Drives vuln injection, policy mode, attack injections, and drift.
      required: true
      value: <+input>.allowedValues(clean,policy-block,zero-day-log4j,zero-day-lodash,drift,xz-backdoor,npm-takeover,all-risks).default(clean)
    - name: slsa_verify_at_deploy
      type: String
      description: Enforce SLSA attestation verification before deploy.
      required: true
      value: <+input>.allowedValues(true,false).default(true)
  stages:
    - stage:
        name: Resolve Preset
        identifier: resolve_preset
        description: Maps scenario_preset to the underlying demo toggles so downstream steps can key off resolved_* outputs.
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Resolve Scenario Preset
                  identifier: resolve_preset_step
                  type: ShellScript
                  timeout: 2m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          case "<+pipeline.variables.scenario_preset>" in
                            clean)           VP=clean;        PM=block; XZ=false; NPM=false; DRIFT=false ;;
                            policy-block)    VP=backend;      PM=block; XZ=false; NPM=false; DRIFT=false ;;
                            zero-day-log4j)  VP=notification; PM=block; XZ=false; NPM=false; DRIFT=false ;;
                            zero-day-lodash) VP=backend;      PM=block; XZ=false; NPM=false; DRIFT=false ;;
                            drift)           VP=clean;        PM=warn;  XZ=false; NPM=false; DRIFT=true  ;;
                            xz-backdoor)     VP=clean;        PM=block; XZ=true;  NPM=false; DRIFT=false ;;
                            npm-takeover)    VP=clean;        PM=block; XZ=false; NPM=true;  DRIFT=false ;;
                            all-risks)       VP=all;          PM=warn;  XZ=true;  NPM=true;  DRIFT=true  ;;
                            *)
                              echo "Unknown preset: <+pipeline.variables.scenario_preset>"
                              exit 1
                              ;;
                          esac
                          echo "resolved_vuln_profile=$VP"
                          echo "resolved_policy_mode=$PM"
                          echo "resolved_inject_xz=$XZ"
                          echo "resolved_inject_npm=$NPM"
                          echo "resolved_force_drift=$DRIFT"
                    outputVariables:
                      - name: resolved_vuln_profile
                        type: String
                        value: VP
                      - name: resolved_policy_mode
                        type: String
                        value: PM
                      - name: resolved_inject_xz
                        type: String
                        value: XZ
                      - name: resolved_inject_npm
                        type: String
                        value: NPM
                      - name: resolved_force_drift
                        type: String
                        value: DRIFT
                    onDelegate: true
        tags: {}
    - stage:
        name: Build and Secure All Services
        identifier: build_and_secure
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Pre-Build Mutations
                  identifier: pre_build_mutations
                  steps:
                    - step:
                        type: Run
                        name: Swap Vulnerable Deps
                        identifier: swap_vulnerable_deps
                        when:
                          stageStatus: Success
                          condition: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_vuln_profile> != "clean"
                        spec:
                          connectorRef: account.harnessImage
                          image: mirror.gcr.io/library/bash:5
                          shell: Sh
                          command: |
                            PROFILE="<+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_vuln_profile>"
                            if [ "$PROFILE" = "all" ]; then
                              bash demo/scripts/swap-vulnerable-dep.sh vulnerable
                            else
                              bash demo/scripts/swap-vulnerable-dep.sh vulnerable --service "$PROFILE"
                            fi
              - stepGroup:
                  name: Run Tests
                  identifier: run_tests
                  steps:
                    - parallel:
                        - step:
                            type: Run
                            name: Run Backend Tests
                            identifier: run_backend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/node:20-alpine
                              shell: Sh
                              command: |
                                cd app/backend
                                npm ci
                                npm test
                        - step:
                            type: Run
                            name: Run Frontend Tests
                            identifier: run_frontend_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/node:20-alpine
                              shell: Sh
                              command: |
                                cd app/frontend
                                rm -rf node_modules package-lock.json
                                npm install
                                npm test
                        - step:
                            type: Run
                            name: Run Notification Tests
                            identifier: run_notification_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: mirror.gcr.io/library/maven:3.9-eclipse-temurin-21
                              shell: Sh
                              command: |
                                cd app/notification-service
                                mvn test -B
              - stepGroup:
                  name: Build and Push Images
                  identifier: build_push_images
                  steps:
                    - parallel:
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Backend
                            identifier: build_push_backend
                            spec:
                              repo: backend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/backend/Dockerfile
                              context: app/backend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Frontend
                            identifier: build_push_frontend
                            spec:
                              repo: frontend-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/frontend/Dockerfile
                              context: app/frontend
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build Notification
                            identifier: build_push_notification
                            spec:
                              repo: notification-service-app
                              tags:
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: app/notification-service/Dockerfile
                              context: app/notification-service
                              labels:
                                org.opencontainers.image.source: <+codebase.repoUrl>
                                org.opencontainers.image.revision: <+codebase.commitSha>
                              registryRef: scs-demo
              - parallel:
                  - stepGroup:
                      name: SCS Backend
                      identifier: scs_backend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation
                            identifier: sbom_generation
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance
                            identifier: slsa_provenance
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                        - step:
                            type: SscaArtifactSigning
                            name: Artifact Signing
                            identifier: artifact_signing
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              signing:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                              uploadSignature:
                                upload: true
                  - stepGroup:
                      name: SCS Frontend
                      identifier: scs_frontend
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation
                            identifier: sbom_generation
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance
                            identifier: slsa_provenance
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                        - step:
                            type: SscaArtifactSigning
                            name: Artifact Signing
                            identifier: artifact_signing
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              signing:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                              uploadSignature:
                                upload: true
                  - stepGroup:
                      name: SCS Notification
                      identifier: scs_notification
                      steps:
                        - step:
                            type: SscaOrchestration
                            name: SBOM Generation
                            identifier: sbom_generation
                            spec:
                              mode: generation
                              tool:
                                type: Syft
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  privateKey: demo_cosign_private
                                  password: demo_cosign_password
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA Provenance
                            identifier: slsa_provenance
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              attestation:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                        - step:
                            type: SscaArtifactSigning
                            name: Artifact Signing
                            identifier: artifact_signing
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              signing:
                                type: cosign
                                spec:
                                  private_key: demo_cosign_private
                                  password: demo_cosign_password
                              uploadSignature:
                                upload: true
          caching:
            enabled: true
            paths: []
          buildIntelligence:
            enabled: true
        description: ""
    - stage:
        name: Approval
        identifier: Approval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approval
                  identifier: Approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
    - stage:
        name: Deploy SupplyWatch
        identifier: Deploy_SupplyWatch
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          services:
            values:
              - serviceRef: supplywatch
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchfrontend
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
              - serviceRef: supplywatchnotification
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: <+input>
            metadata:
              parallel: true
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: supplywatchprod
          execution:
            steps:
              - parallel:
                  - stepGroup:
                      name: SCS Gates Prod - Backend
                      identifier: scs_gates_prod_backend
                      steps:
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification
                            identifier: slsa_verification
                            when:
                              stageStatus: Success
                              condition: <+pipeline.variables.slsa_verify_at_deploy> == "true"
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: backend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification
                            identifier: artifact_verification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: backend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement
                            identifier: sbom_policy_enforcement
                            when:
                              stageStatus: Success
                              condition: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> != "skip"
                            spec:
                              source:
                                type: har
                                spec:
                                  image: backend-app:<+pipeline.sequenceId>
                                  registry: scs-demo
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                policySets:
                                  - SBOM_CI_Enforcement
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: MarkAsSuccess
                                  when: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> == "warn"
                  - stepGroup:
                      name: SCS Gates Prod - Frontend
                      identifier: scs_gates_prod_frontend
                      steps:
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification
                            identifier: slsa_verification
                            when:
                              stageStatus: Success
                              condition: <+pipeline.variables.slsa_verify_at_deploy> == "true"
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: frontend-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification
                            identifier: artifact_verification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: frontend-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement
                            identifier: sbom_policy_enforcement
                            when:
                              stageStatus: Success
                              condition: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> != "skip"
                            spec:
                              source:
                                type: har
                                spec:
                                  image: frontend-app:<+pipeline.sequenceId>
                                  registry: scs-demo
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                policySets:
                                  - SBOM_CI_Enforcement
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: MarkAsSuccess
                                  when: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> == "warn"
                  - stepGroup:
                      name: SCS Gates Prod - Notification
                      identifier: scs_gates_prod_notification
                      steps:
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification
                            identifier: slsa_verification
                            when:
                              stageStatus: Success
                              condition: <+pipeline.variables.slsa_verify_at_deploy> == "true"
                            spec:
                              source:
                                type: Har
                                spec:
                                  registry: scs-demo
                                  tag: <+pipeline.sequenceId>
                                  image: notification-service-app
                              verify_attestation:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification
                            identifier: artifact_verification
                            spec:
                              source:
                                type: har
                                spec:
                                  registry: scs-demo
                                  image: notification-service-app:<+pipeline.sequenceId>
                              verifySign:
                                type: cosign
                                spec:
                                  public_key: demo_cosign_public
                        - step:
                            type: SscaEnforcement
                            name: SBOM Policy Enforcement
                            identifier: sbom_policy_enforcement
                            when:
                              stageStatus: Success
                              condition: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> != "skip"
                            spec:
                              source:
                                type: har
                                spec:
                                  image: notification-service-app:<+pipeline.sequenceId>
                                  registry: scs-demo
                              verifyAttestation:
                                type: cosign
                                spec:
                                  publicKey: demo_cosign_public
                              policy:
                                policySets:
                                  - SBOM_CI_Enforcement
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: MarkAsSuccess
                                  when: <+pipeline.stages.resolve_preset.spec.execution.steps.resolve_preset_step.output.outputVariables.resolved_policy_mode> == "warn"
              - stepGroup:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  steps:
                    - step:
                        name: Canary Deployment
                        identifier: canaryDeployment
                        type: K8sCanaryDeploy
                        timeout: 10m
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                    - step:
                        name: Canary Delete
                        identifier: canaryDelete
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}
              - stepGroup:
                  name: Primary Deployment
                  identifier: primaryDeployment
                  steps:
                    - step:
                        name: Rolling Deployment
                        identifier: rollingDeployment
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
              - step:
                  name: Get Frontend URL
                  identifier: get_frontend_url
                  type: ShellScript
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+service.identifier> == "supplywatchfrontend"
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          export KUBECONFIG="$HARNESS_KUBE_CONFIG_PATH"
                          for i in {1..30}; do
                            EXTERNAL_IP=$(kubectl get svc supplywatch-frontend-svc -n prod-env -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                            if [ -n "$EXTERNAL_IP" ]; then
                              FRONTEND_URL="http://${EXTERNAL_IP}"
                              echo ""
                              echo "=================================================="
                              echo " Frontend is live: $FRONTEND_URL"
                              echo "=================================================="
                              echo ""
                              export FRONTEND_URL
                              break
                            fi
                            echo "Waiting for LoadBalancer IP... (attempt $i/30)"
                            sleep 10
                          done
                          if [ -z "$EXTERNAL_IP" ]; then
                            echo "WARNING: LoadBalancer IP not assigned after 5 minutes"
                            exit 1
                          fi
                    outputVariables:
                      - name: FRONTEND_URL
                        type: String
                        value: FRONTEND_URL
                    onDelegate: true
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  triggers:
    - trigger:
        name: On Push to Main
        identifier: on_push_main
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
              actions: []
    - trigger:
        name: On Pull Request
        identifier: on_pull_request
        enabled: true
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: demo_github
              autoAbortPreviousExecutions: true
              payloadConditions: []
              actions:
                - Open
                - Reopen
                - Synchronize
  notificationRules:
    - name: Policy Violation Alert
      identifier: policy_violation_alert
      pipelineEvents:
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
    - name: Production Approval Needed
      identifier: prod_approval_needed
      pipelineEvents:
        - type: StageSuccess
          forStages:
            - build_and_secure
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+input>
      enabled: true
  allowStageExecutions: true
