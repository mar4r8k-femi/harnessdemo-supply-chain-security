inputSet:
  name: Build Feature Branch
  identifier: build_feature
  description: >-
    Input set for CI builds triggered on feature/PR branches. Uses a separate
    image tag namespace to avoid polluting the main image stream. Useful for
    testing SCS policy enforcement on experimental changes.
  tags:
    scs-demo: ""
    feature: ""
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  pipeline:
    identifier: scs_demo_ci_build
    properties:
      ci:
        codebase:
          build:
            type: PR
            spec:
              number: <+input>
    stages:
      - stage:
          identifier: build_backend
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: build_push_backend
                    type: BuildAndPushDockerRegistry
                    spec:
                      repo: <+input>.default(supplywatch/backend)
      - stage:
          identifier: build_frontend
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: build_push_frontend
                    type: BuildAndPushDockerRegistry
                    spec:
                      repo: <+input>.default(supplywatch/frontend)
      - stage:
          identifier: build_notification
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: build_push_notification
                    type: BuildAndPushDockerRegistry
                    spec:
                      repo: <+input>.default(supplywatch/notification-service)
    notificationRules:
      - identifier: policy_violation_alert
        notificationMethod:
          spec:
            webhookUrl: <+input>
