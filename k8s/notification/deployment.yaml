apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
    app.kubernetes.io/name: {{.Values.name}}
    app.kubernetes.io/part-of: supplywatch
    app.kubernetes.io/component: notification
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  template:
    metadata:
      labels:
        app: {{.Values.name}}
        app.kubernetes.io/name: {{.Values.name}}
        app.kubernetes.io/part-of: supplywatch
    spec:
      containers:
        - name: notification
          image: {{.Values.image}}
          ports:
            - containerPort: {{.Values.serviceTargetPort}}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: default
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{.Values.serviceTargetPort}}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{.Values.serviceTargetPort}}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
