apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}-svc
  labels:
    app: {{.Values.name}}
    app.kubernetes.io/name: {{.Values.name}}
    app.kubernetes.io/part-of: supplywatch
spec:
  type: {{.Values.serviceType}}
  selector:
    app: {{.Values.name}}
  ports:
    - port: {{.Values.servicePort}}
      targetPort: {{.Values.serviceTargetPort}}
      protocol: TCP
