apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
    app.kubernetes.io/name: {{.Values.name}}
    app.kubernetes.io/part-of: supplywatch
    app.kubernetes.io/component: frontend
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  template:
    metadata:
      labels:
        app: {{.Values.name}}
        app.kubernetes.io/name: {{.Values.name}}
        app.kubernetes.io/part-of: supplywatch
    spec:
      containers:
        - name: frontend
          image: {{.Values.image}}
          ports:
            - containerPort: {{.Values.serviceTargetPort}}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{.Values.serviceTargetPort}}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{.Values.serviceTargetPort}}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
