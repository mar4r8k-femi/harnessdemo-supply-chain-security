apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplywatch-frontend
  labels:
    app: supplywatch-frontend
    app.kubernetes.io/name: supplywatch-frontend
    app.kubernetes.io/part-of: supplywatch
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supplywatch-frontend
  template:
    metadata:
      labels:
        app: supplywatch-frontend
        app.kubernetes.io/name: supplywatch-frontend
        app.kubernetes.io/part-of: supplywatch
    spec:
      containers:
        - name: frontend
          image: <+artifacts.primary.image>
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
